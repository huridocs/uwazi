name: Build test images

# Reusable: builds the CI test image (source + dev deps + client tooling) and
# the Mongo/MinIO service images. Tagged by git tree SHA so the same content
# address is shared by every consumer and promoted on production.
on:
  workflow_call:
    inputs:
      tree:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build_test_images:
    name: build_test_images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CI test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ci
          push: true
          tags: ghcr.io/${{ github.repository }}-ci:tree-${{ inputs.tree }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-ci:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-ci:cache,mode=max,ignore-error=true

      - name: Build and push Mongo service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/mongo-service.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-mongo-ci:tree-${{ inputs.tree }}

      - name: Build and push MinIO service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/minio-service.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-minio-ci:tree-${{ inputs.tree }}
