name: Build production artifact

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CYPRESS_IMAGE_NAME: ${{ github.repository }}-cypress-e2e

jobs:
  build_cypress_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Cypress Dockerfile change
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          SHOULD_BUILD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_BUILD=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}":"refs/remotes/origin/${{ github.base_ref }}" || true
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null | grep -q "^\\.github/ci/Dockerfile\\.cypress$"; then
              SHOULD_BUILD=true
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q "^\\.github/ci/Dockerfile\\.cypress$"; then
              SHOULD_BUILD=true
            fi
          fi
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.changes.outputs.should_build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Cypress Docker image
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/ci/Dockerfile.cypress
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}:cache,mode=max

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

      - name: Cache Webpack
        uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-webpack-${{ hashFiles('**/yarn.lock') }}

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('**/yarn.lock') }}

      - name: install dependencies
        run: yarn install
      - name: build production
        run: yarn production-build
      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod
          path: |
            ./prod/dist
            ./prod/app
            ./prod/database
            ./prod/scripts
            ./prod/public
            ./prod/package.json
            ./prod/server.js
            ./prod/message.js
            ./prod/contents
            ./prod/uploaded_documents
            ./prod/temporal_files
            ./prod/custom_uploads
            ./prod/log
          compression-level: 9
