name: Build production artifact

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CYPRESS_IMAGE_NAME: ${{ github.repository }}-cypress-e2e

jobs:
  build_cypress_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check if Docker image needs rebuilding
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow dispatch - building image"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building image (Docker cache will determine if rebuild is needed)"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.changes.outputs.should_build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Cypress Docker image
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/ci/Dockerfile.cypress
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}:cache,mode=max

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # ===== OPTIMIZED CONSOLIDATED CACHING STRATEGY =====
      
      # Cache 1: Dependencies (Most Stable, Highest Cache Hit Rate)
      # Combines: node_modules + yarn cache + production dependencies (~1.1GB)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            ~/.cache/yarn
            prod/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock', 'package.json') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ github.base_ref }}-
            ${{ runner.os }}-deps-

      # Cache 2: Build Artifacts (High Stability, High Cache Hit Rate)
      # Combines: webpack cache + backend API + shared code + server files (~244MB)
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .webpack-cache
            node_modules/.cache
            prod/dist
            prod/app/api
            prod/app/shared
            prod/app
          key: ${{ runner.os }}-build-${{ hashFiles('webpack/**', 'app/**', 'package.json', 'yarn.lock', 'babel.config.json', 'tailwind.config.js', 'postcss.config.js') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('webpack/**', 'package.json', 'yarn.lock') }}
            ${{ runner.os }}-build-${{ github.base_ref }}-
            ${{ runner.os }}-build-

      # Cache 3: Static Assets (Very Stable, Very High Cache Hit Rate)
      # Combines: static assets + database & scripts (~0.2MB)
      - name: Cache static assets
        uses: actions/cache@v4
        with:
          path: |
            public
            contents
            prod/database
            prod/scripts
            prod/message.js
          key: ${{ runner.os }}-static-${{ hashFiles('public/**', 'contents/**', 'database/**', 'scripts/**', 'message.js') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-static-${{ github.base_ref }}-
            ${{ runner.os }}-static-

      # ===== BUILD PROCESS =====
      
      - name: Install dependencies
        run: yarn install

      - name: Build production (chunked)
        run: yarn production-build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod
          path: |
            ./prod/dist
            ./prod/app
            ./prod/database
            ./prod/scripts
            ./prod/public
            ./prod/package.json
            ./prod/server.js
            ./prod/message.js
            ./prod/contents
            ./prod/uploaded_documents
            ./prod/temporal_files
            ./prod/custom_uploads
            ./prod/log
          compression-level: 9
