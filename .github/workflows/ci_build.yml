name: Build production artifact

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CYPRESS_IMAGE_NAME: ${{ github.repository }}-cypress-e2e

jobs:
  build_cypress_image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check if Docker image needs rebuilding
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow dispatch - building image"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building image (Docker cache will determine if rebuild is needed)"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: steps.changes.outputs.should_build == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Set up Docker Buildx
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Cypress Docker image
        if: steps.changes.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./.github/ci/Dockerfile.cypress
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.CYPRESS_IMAGE_NAME }}:cache,mode=max

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # ===== OPTIMIZED CHUNKED CACHING STRATEGY =====
      
      # Chunk 1: Node Modules (Most Stable, Highest Cache Hit Rate)
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # Chunk 2: Yarn Cache (Stable, High Cache Hit Rate)
      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-cache-

      # Chunk 3: Static Assets (Very Stable, Very High Cache Hit Rate)
      - name: Cache static assets
        uses: actions/cache@v4
        with:
          path: |
            public
            contents
          key: ${{ runner.os }}-static-${{ hashFiles('public/**', 'contents/**') }}
          restore-keys: |
            ${{ runner.os }}-static-${{ github.base_ref }}-
            ${{ runner.os }}-static-

      # Chunk 4: Shared Code (Medium Stability, Medium Cache Hit Rate)
      - name: Cache shared code
        uses: actions/cache@v4
        with:
          path: prod/app/shared
          key: ${{ runner.os }}-shared-${{ hashFiles('app/shared/**') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-shared-${{ github.base_ref }}-
            ${{ runner.os }}-shared-

      # Chunk 5: Backend API (Low Stability, Low Cache Hit Rate)
      - name: Cache backend API
        uses: actions/cache@v4
        with:
          path: prod/app/api
          key: ${{ runner.os }}-api-${{ hashFiles('app/api/**') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-api-${{ github.base_ref }}-
            ${{ runner.os }}-api-

      # Chunk 6: Frontend Assets (Medium Stability, High Cache Hit Rate with Webpack)
      - name: Cache Webpack build
        uses: actions/cache@v4
        with:
          path: |
            .webpack-cache
            node_modules/.cache
            prod/dist
          key: ${{ runner.os }}-webpack-${{ hashFiles('app/react/**', 'webpack/**', 'package.json', 'yarn.lock') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-webpack-${{ github.base_ref }}-
            ${{ runner.os }}-webpack-

      # Chunk 7: Database & Scripts (High Stability, High Cache Hit Rate)
      - name: Cache database and scripts
        uses: actions/cache@v4
        with:
          path: |
            prod/database
            prod/scripts
            prod/message.js
          key: ${{ runner.os }}-db-scripts-${{ hashFiles('database/**', 'scripts/**', 'message.js') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-db-scripts-${{ github.base_ref }}-
            ${{ runner.os }}-db-scripts-

      # Chunk 8: Server Files (Medium Stability, Medium Cache Hit Rate)
      - name: Cache server files
        uses: actions/cache@v4
        with:
          path: prod/app
          key: ${{ runner.os }}-server-${{ hashFiles('app/server.js', 'app/initSentry.ts', 'app/*.ts', 'app/*.js') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-server-${{ github.base_ref }}-
            ${{ runner.os }}-server-

      # Chunk 9: Production Dependencies (Very Stable, Very High Cache Hit Rate)
      - name: Cache production dependencies
        uses: actions/cache@v4
        with:
          path: prod/node_modules
          key: ${{ runner.os }}-prod-deps-${{ hashFiles('package.json', 'yarn.lock') }}-${{ github.base_ref }}
          restore-keys: |
            ${{ runner.os }}-prod-deps-${{ github.base_ref }}-
            ${{ runner.os }}-prod-deps-

      # ===== BUILD PROCESS =====
      
      - name: Install dependencies
        run: yarn install

      - name: Build production (chunked)
        run: yarn production-build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod
          path: |
            ./prod/dist
            ./prod/app
            ./prod/database
            ./prod/scripts
            ./prod/public
            ./prod/package.json
            ./prod/server.js
            ./prod/message.js
            ./prod/contents
            ./prod/uploaded_documents
            ./prod/temporal_files
            ./prod/custom_uploads
            ./prod/log
          compression-level: 9
