name: CI Precheck

on:
  workflow_call:
    outputs:
      should_run:
        description: Whether downstream jobs should run
        value: ${{ jobs.precheck.outputs.should_run }}

permissions:
  contents: read
  pull-requests: read

jobs:
  precheck:
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.compute.outputs.should_run }}
    steps:
      - name: Compute should_run
        id: compute
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let shouldRun = false;

            async function getHeadCommitMessage() {
              try {
                if (eventName === 'pull_request') {
                  const sha = context.payload.pull_request.head.sha;
                  const { data } = await github.repos.getCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: sha,
                  });
                  return (data && data.commit && data.commit.message) || '';
                } else if (eventName === 'push') {
                  return (context.payload.head_commit && context.payload.head_commit.message) || '';
                }
              } catch (e) {
                return '';
              }
              return '';
            }
            function containsRunTests(text) {
              if (!text || typeof text !== 'string') return false;
              return /\[run tests\]/i.test(text);
            }

            const headMessage = await getHeadCommitMessage();
            let hasRunTests = containsRunTests(headMessage);

            if (!hasRunTests && eventName === 'push') {
              const commits = Array.isArray(context.payload.commits) ? context.payload.commits : [];
              hasRunTests = commits.some(c => containsRunTests((c && c.message) || ''));
            }

            if (!hasRunTests && eventName === 'pull_request') {
              const pr = context.payload.pull_request || {};
              const prTitle = pr.title || '';
              const prBody = pr.body || '';
              if (containsRunTests(prTitle) || containsRunTests(prBody)) {
                hasRunTests = true;
              } else {
                try {
                  const commits = await github.paginate(github.pulls.listCommits, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100,
                  });
                  hasRunTests = commits.some(c => containsRunTests((c && c.commit && c.commit.message) || ''));
                } catch (e) {
                  // ignore and fall back to headMessage result
                }
              }
            }

            if (eventName === 'workflow_dispatch') {
              shouldRun = true;
            } else if (eventName === 'push') {
              if (context.ref === 'refs/heads/development') {
                shouldRun = true;
              } else if (hasRunTests) {
                shouldRun = true;
              }
            } else if (eventName === 'pull_request') {
              const isDraft = Boolean(context.payload.pull_request && context.payload.pull_request.draft);
              if (!isDraft) {
                shouldRun = true;
              } else if (hasRunTests) {
                shouldRun = true;
              }
            }

            core.setOutput('should_run', String(shouldRun));

