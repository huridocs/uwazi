name: Setup MongoDB Tools

on:
  workflow_call:

jobs:
  setup_mongosh:
    runs-on: ubuntu-24.04
    steps:
      - name: Cache MongoDB tools
        id: cache-mongodb
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: ${{ runner.os }}-mongodb-tools-6.0

      - name: Install MongoDB tools if not cached
        run: |
          if [ -f ~/.local/bin/mongosh ] && [ -f ~/.local/bin/mongorestore ]; then
            echo "MongoDB tools found in cache"
            export PATH="$HOME/.local/bin:$PATH"
          else
            echo "Installing MongoDB tools..."
            # Add MongoDB repo if not already present
            if [ ! -f /etc/apt/sources.list.d/mongodb-org-6.0.list ]; then
              sudo apt-get update -qq
              sudo apt-get install -y wget gnupg
              wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
              echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
            fi

            # Install MongoDB tools
            sudo apt-get update -qq
            sudo apt-get install -y mongodb-mongosh mongodb-org-tools
            
            # Copy to cache location for next run
            mkdir -p ~/.local/bin
            sudo cp /usr/bin/mongosh ~/.local/bin/
            sudo cp /usr/bin/mongorestore ~/.local/bin/
            sudo chown $USER:$USER ~/.local/bin/mongosh ~/.local/bin/mongorestore
          fi

      - name: Verify mongosh installation
        run: |
          mongosh --version
          mongorestore --version
