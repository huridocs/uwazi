name: E2E Playwright IX

on:
  workflow_call:
    inputs:
      backend_image:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  e2e-playwright-ix:
    runs-on: ubuntu-24.04
    name: e2e-playwright (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ix
            spec: 'playwright/e2e/ix-lifecycle.contract.spec.ts'
          - name: px
            spec: 'playwright/e2e/paragraph-extraction.contract.spec.ts'
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0-amd64
        ports:
          - 9200:9200
        options: >-
          --memory=2g
          --memory-swap=2g
          --memory-swappiness=0
          -e="discovery.type=single-node"
          -e="xpack.security.enabled=false"
          -e="ES_JAVA_OPTS=-Xms1g -Xmx1g"
          -e="cluster.routing.allocation.disk.threshold_enabled=false"
          -e="logger.level=WARN"
          -e="ingest.geoip.downloader.enabled=false"
          --health-cmd="curl -f http://localhost:9200"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
      redis:
        image: redis:6.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Install MongoDB tools
        run: |
          if [ ! -f /etc/apt/sources.list.d/mongodb-org-7.0.list ]; then
            sudo apt-get update -qq
            sudo apt-get install -y wget gnupg
            wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
            echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          fi
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-mongosh mongodb-org-tools

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 7.0
          mongodb-replica-set: test-rs

      - uses: actions/checkout@v4

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('patches/**') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry
          key: ${{ runner.os }}-yarn-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-cache-

      - name: Enable Corepack
        run: corepack enable

      - name: install dependencies
        run: yarn install
        env:
          YARN_ENABLE_HARDENED_MODE: '0'

      - name: Install Playwright browsers and OS deps
        uses: ./.github/actions/install-playwright-os-deps
        with:
          command: npx playwright install --with-deps chromium

      - name: Clone dummy services
        uses: actions/checkout@v4
        with:
          repository: huridocs/dummy_extractor_services
          path: dummy_extractor_services

      - name: Setup dummy services
        working-directory: dummy_extractor_services
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv python3-pip redis-tools
          make install_venv

          . .venv/bin/activate
          PYTHONUNBUFFERED=1 setsid nohup bash -c 'make start_inside_docker' > logs.log 2>&1 &
          disown || true

          echo "Waiting for gunicorn HTTP servers..."
          sleep 5 && wget --waitretry=5 --retry-connrefused -v http://localhost:5051/info
          wget --waitretry=5 --retry-connrefused -v http://localhost:5056/info

          echo "Waiting for dummy workers to register Redis queues..."
          STREAMS=0
          for i in $(seq 1 30); do
            STREAMS=$(redis-cli -h localhost -p 6379 KEYS 'rsmq:*' 2>/dev/null | wc -l)
            if [ "$STREAMS" -gt 0 ]; then
              echo "Found $STREAMS Redis queue keys after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$STREAMS" -eq 0 ]; then
            echo "ERROR: dummy workers did not register any Redis queues"
            cat logs.log
            exit 1
          fi

          echo "=== dummy services processes ==="
          if ! pgrep -f "gunicorn|worker_(metadata|paragraphs|translations)" >/dev/null; then
            echo "ERROR: dummy services processes not running"
            cat logs.log
            exit 1
          fi

      - name: Restore fixtures
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:9200
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
        run: yarn e2e-fixtures

      - name: Configure IX settings
        run: yarn ix-config
        env:
          DBHOST: localhost:27017
          DATABASE_NAME: uwazi_e2e

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Uwazi from backend image
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:9200
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
          EXTERNAL_SERVICES: true
          FEATURE_FLAG_PARAGRAPH_EXTRACTION: true
          SKIP_MIGRATION_CHECK: true
        run: |
          # Built by Dockerized CI (build_runtime_images); guaranteed present by
          # the `needs` dependency before this job starts.
          docker pull "$BACKEND_IMAGE"

          # Share the runner's writable dirs with the backend container so the
          # restored fixture PDFs (uploaded_documents) and uploads written by the
          # server are visible on both sides. World-writable so the non-root
          # `uwazi` user inside the image can read/write them.
          mkdir -p uploaded_documents custom_uploads temporal_files log
          chmod -R a+rwX uploaded_documents custom_uploads temporal_files log

          docker run -d --name uwazi-backend --network host \
            -v "$PWD/uploaded_documents:/app/uploaded_documents" \
            -v "$PWD/custom_uploads:/app/custom_uploads" \
            -v "$PWD/temporal_files:/app/temporal_files" \
            -v "$PWD/log:/app/log" \
            -e DBHOST="$DBHOST" \
            -e ELASTICSEARCH_URL="$ELASTICSEARCH_URL" \
            -e REDIS_HOST="$REDIS_HOST" \
            -e REDIS_PORT="$REDIS_PORT" \
            -e DATABASE_NAME="$DATABASE_NAME" \
            -e INDEX_NAME="$INDEX_NAME" \
            -e EXTERNAL_SERVICES="$EXTERNAL_SERVICES" \
            -e FEATURE_FLAG_PARAGRAPH_EXTRACTION="$FEATURE_FLAG_PARAGRAPH_EXTRACTION" \
            -e SKIP_MIGRATION_CHECK="$SKIP_MIGRATION_CHECK" \
            "$BACKEND_IMAGE"

          for i in {1..60}; do
            if curl -sf http://localhost:3000/api/version >/dev/null; then
              echo "Uwazi is up"; exit 0
            fi
            echo "Waiting for Uwazi... (attempt $i/60)"
            sleep 2
          done
          echo "Uwazi failed to start"
          docker logs uwazi-backend --tail 100
          exit 1

      - name: Run Playwright spec - ${{ matrix.name }}
        run: yarn playwright test ${{ matrix.spec }} --workers=1
        timeout-minutes: 30
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:9200
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          EXTERNAL_SERVICES: true
          FEATURE_FLAG_PARAGRAPH_EXTRACTION: true

      - name: Capture Uwazi logs
        if: always()
        run: |
          mkdir -p .github/logs
          docker logs uwazi-backend > .github/logs/uwazi-backend.log 2>&1 || true

      - name: Cleanup backend container
        if: always()
        run: docker rm -f uwazi-backend >/dev/null 2>&1 || true

      - name: Upload dummy services log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}-dummy-services-log
          path: dummy_extractor_services/logs.log
          if-no-files-found: ignore

      - name: Upload Playwright test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Uwazi logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}-logs
          path: .github/logs/
          if-no-files-found: ignore
