name: Build runtime images

# Reusable: builds the backend runtime image (the slow webpack production
# build). The single image runs backend (default), queue worker, or legacy
# worker via its entrypoint. Tagged by git tree SHA so the same content address
# is shared by every consumer and promoted on production.
on:
  workflow_call:
    inputs:
      tree:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build_runtime_images:
    name: build_runtime_images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:tree-${{ inputs.tree }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
            type=registry,ref=ghcr.io/${{ github.repository }}-ci:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max,ignore-error=true

