name: E2E Puppeteer

on:
  workflow_call:

jobs:
  e2e-puppeteer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite-dir: ['suite1', 'suite2', 'mobile']
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.7-amd64
        ports:
          - 9200/tcp
        options: -e="discovery.type=single-node" --health-cmd="curl http://localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Cache MongoDB tools
        id: cache-mongodb
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: ${{ runner.os }}-ubuntu-24.04-mongodb-tools-6.0

      - name: Install MongoDB tools if not cached
        run: |
          if [ -f ~/.local/bin/mongosh ] && [ -f ~/.local/bin/mongorestore ]; then
            echo "MongoDB tools found in cache"
            export PATH="$HOME/.local/bin:$PATH"
          else
            echo "Installing MongoDB tools..."
            # Add MongoDB repo if not already present
            if [ ! -f /etc/apt/sources.list.d/mongodb-org-6.0.list ]; then
              sudo apt-get update -qq
              sudo apt-get install -y wget gnupg
              wget -qO - https://www.mongodb.org/static/pgp/server-6.0.asc | sudo apt-key add -
              echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-6.0.list
            fi

            # Install MongoDB tools
            sudo apt-get update -qq
            sudo apt-get install -y mongodb-mongosh mongodb-org-tools
            
            # Copy to cache location for next run
            mkdir -p ~/.local/bin
            sudo cp /usr/bin/mongosh ~/.local/bin/
            sudo cp /usr/bin/mongorestore ~/.local/bin/
            sudo chown $USER:$USER ~/.local/bin/mongosh ~/.local/bin/mongorestore
          fi

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.8.0
        with:
          mongodb-version: 6.0
          mongodb-replica-set: test-rs
      - uses: actions/checkout@v4
      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
      - name: install dependencies
        run: yarn install
      - name: Cache poppler-utils
        id: cache-poppler
        uses: actions/cache@v4
        with:
          path: ~/.local/system-packages
          key: ${{ runner.os }}-ubuntu-24.04-poppler-utils

      - name: Install poppler-utils if not cached
        run: |
          if [ -f ~/.local/system-packages/pdftoppm ] && [ -f ~/.local/system-packages/pdftotext ]; then
            echo "poppler-utils found in cache"
            export PATH="$HOME/.local/system-packages:$PATH"
          else
            echo "Installing poppler-utils..."
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
            
            # Copy actual binaries to cache location for next run
            mkdir -p ~/.local/system-packages
            sudo cp /usr/bin/pdftoppm ~/.local/system-packages/
            sudo cp /usr/bin/pdftotext ~/.local/system-packages/
            sudo cp /usr/bin/pdfinfo ~/.local/system-packages/
            sudo chown $USER:$USER ~/.local/system-packages/pdftoppm ~/.local/system-packages/pdftotext ~/.local/system-packages/pdfinfo
          fi
      - name: Download production build artifact
        uses: actions/download-artifact@v4
        with:
          name: prod
          path: ./prod
      - run: yarn e2e-fixtures
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:${{ job.services.elasticsearch.ports[9200] }}
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
          TRANSPILED: true
      - name: start Uwazi
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:${{ job.services.elasticsearch.ports[9200] }}
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
        run: .github/scripts/start-uwazi.sh
      - run: xvfb-run -a yarn e2e-puppeteer-all --roots '<rootDir>/${{ matrix.suite-dir }}'
        timeout-minutes: 25
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:${{ job.services.elasticsearch.ports[9200] }}
          TRANSPILED: true
      - name: Print server output
        run: |
          echo "📁 Startup logs:"
          cat .github/logs/start-uwazi-logs.txt || echo "Startup log file not found"
          echo
          echo "📁 Health-check logs:"
          cat .github/logs/health-check-logs.txt || echo "Health-check log file not found"
        if: failure()
