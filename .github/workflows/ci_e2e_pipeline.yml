name: E2E Pipeline

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development, staging, production, 'dependabot/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write
  checks: read
  actions: read

jobs:
  precheck:
    uses: ./.github/workflows/precheck.yml
    secrets: inherit
    with:
      is_pr: ${{ github.event_name == 'pull_request' }}
      pr_number: ${{ github.event.pull_request.number }}
      is_draft: ${{ github.event.pull_request.draft }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      ref: ${{ github.ref }}
      branch: ${{ github.ref_name }}
      event_name: ${{ github.event_name }}
      is_protected_push: ${{ github.ref_name == 'development' || github.ref_name == 'production' }}
      sha: ${{ github.sha }}

  build_backend_image:
    needs: precheck
    if: ${{ needs.precheck.outputs.should_run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max,ignore-error=true

  e2e_playwright_core:
    needs: [precheck, build_backend_image]
    if: ${{ needs.precheck.outputs.should_run == 'true' && needs.build_backend_image.result == 'success' }}
    uses: ./.github/workflows/ci_e2e_playwright_core.yml
    with:
      backend_image: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}

  e2e_playwright_data:
    needs: [precheck, build_backend_image]
    if: ${{ needs.precheck.outputs.should_run == 'true' && needs.build_backend_image.result == 'success' }}
    uses: ./.github/workflows/ci_e2e_playwright_data.yml
    with:
      backend_image: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}

  e2e_playwright_ix:
    needs: [precheck, build_backend_image]
    if: ${{ needs.precheck.outputs.should_run == 'true' && needs.build_backend_image.result == 'success' }}
    uses: ./.github/workflows/ci_e2e_playwright_ix.yml
    with:
      backend_image: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}

