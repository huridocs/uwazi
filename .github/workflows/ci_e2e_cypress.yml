name: E2E Cypress Tests

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  CYPRESS_IMAGE_NAME: ${{ github.repository }}-cypress-e2e

jobs:
  e2e-cypress:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}-cypress-e2e:latest
      options: --ipc=host
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            spec: 'cypress/e2e/base/*.cy.ts'
            needs_setup: false
            needs_ix_config: false
            needs_external_services: false
          - name: entities
            spec: 'cypress/e2e/entities/*.cy.ts'
            needs_setup: false
            needs_ix_config: false
            needs_external_services: false
          - name: information-extraction
            spec: 'cypress/e2e/informationExtraction/*.cy.ts'
            needs_setup: true
            needs_ix_config: true
            needs_external_services: true
          - name: pages
            spec: 'cypress/e2e/pages/*.cy.ts'
            needs_setup: false
            needs_ix_config: false
            needs_external_services: false
          - name: settings
            spec: 'cypress/e2e/settings/*.cy.ts'
            needs_setup: false
            needs_ix_config: false
            needs_external_services: false
    env:
      CYPRESS_RETRIES: 2
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0-amd64
        ports:
          - 9200/tcp
        options: -e="discovery.type=single-node" -e="xpack.security.enabled=false" -e="ES_JAVA_OPTS=-Xms512m -Xmx512m" -e="cluster.routing.allocation.disk.threshold_enabled=false" -e="logger.level=WARN" -e="ingest.geoip.downloader.enabled=false" --health-cmd="curl -f http://localhost:9200" --health-interval=10s --health-timeout=10s --health-retries=10
      redis:
        image: redis:6.0-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      
      - name: Start MongoDB replica set
        run: /usr/local/bin/setup-mongo-replica.sh

      - name: Wait for MongoDB replica set to be ready
        run: |
          for i in {1..60}; do
            if mongosh --host localhost --port 27017 --quiet --eval 'try { rs.status().myState } catch (e) { print(0) }' | tail -n 1 | grep -q "1"; then
              echo "Mongo replica set is PRIMARY and ready"; break
            fi
            echo "Waiting for Mongo replica set... (attempt $i/60)"
            sleep 2
          done
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
      - name: install dependencies
        run: yarn install
      
      - name: Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-
      
      - name: Install Cypress binary if not cached
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        run: npx cypress install

      - name: Verify pre-installed tools
        run: |
          echo "Verifying mongosh..."
          mongosh --version
          echo "Verifying poppler-utils..."
          pdftotext -v
          pdftoppm -v
          pdfinfo -v
          echo "Verifying Chrome 140..."
          google-chrome --version | grep -q "140" && echo "✓ Chrome 140 detected" || echo "❌ Chrome 140 not found"
          echo "Verifying Xvfb..."
          which xvfb-run
          echo "Verifying Python..."
          python3.11 --version
      - name: Download production build artifact
        uses: actions/download-artifact@v4
        with:
          name: prod
          path: ./prod
      - name: Clone dummy services
        if: matrix.needs_setup
        uses: actions/checkout@v4
        with:
          repository: huridocs/dummy_extractor_services
          path: dummy_extractor_services
      - name: Setup dummy services
        if: matrix.needs_setup
        run: |
          python3.11 -m venv .venv
          make install_venv
          make start > logs.log &
          sleep 5 && wget --waitretry=5 --retry-connrefused -v http://localhost:5051/info
        working-directory: dummy_extractor_services
      - name: Log dummy services on failure
        if: matrix.needs_setup && failure()
        run: cat dummy_extractor_services/logs.log
      - name: Configure IX settings
        if: matrix.needs_ix_config
        run: yarn ix-config
        env:
          DBHOST: localhost:27017
          DATABASE_NAME: uwazi_e2e
      - run: yarn blank-state
        id: blank-state-attempt1
        continue-on-error: true
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://elasticsearch:9200
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
          TRANSPILED: true
      - run: yarn blank-state --force
        id: blank-state-attempt2
        if: steps.blank-state-attempt1.outcome == 'failure'
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://elasticsearch:9200
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
          TRANSPILED: true
      - name: Debug - Check MongoDB and Elasticsearch status
        run: |
          echo "=== CONTAINER ENVIRONMENT DEBUG ==="
          echo "Container OS:"
          cat /etc/os-release
          echo ""
          echo "Chrome version:"
          google-chrome --version
          echo ""
          echo "Node version:"
          node --version
          echo ""
          echo "NPM version:"
          npm --version
          echo ""
          echo "Installing network tools for debugging..."
          apt-get update -qq && apt-get install -y iproute2 net-tools netcat-openbsd redis-tools dnsutils
          echo ""
          echo "Network interfaces:"
          ip addr show
          echo ""
          echo "Environment variables:"
          env | grep -E "(DBHOST|ELASTICSEARCH|REDIS|DATABASE|INDEX)" | sort
          echo ""
          echo "=== SERVICE STATUS ==="
          echo "Checking MongoDB status..."
          mongosh --host localhost --port 27017 --quiet --eval 'rs.status().myState'
          echo "MongoDB databases:"
          mongosh --host localhost --port 27017 --quiet --eval 'db.adminCommand("listDatabases")'
          echo ""
          echo "Checking Elasticsearch..."
          curl -s http://localhost:9200/_cluster/health || echo "Elasticsearch not reachable"
          echo ""
          echo "Checking Redis..."
          redis-cli -h localhost -p 6379 ping || echo "Redis not reachable"
          echo ""
          echo "Checking production build:"
          ls -la prod/ | head -20
          echo ""
          echo "=== CONTAINER PROCESSES ==="
          ps aux | grep -E "(mongod|elasticsearch|redis)" || echo "No matching processes found"
          
      - name: Debug - Container networking analysis
        run: |
          echo "=== CONTAINER NETWORKING ANALYSIS ==="
          echo "1. Container hostname resolution:"
          echo "   elasticsearch hostname:"
          nslookup elasticsearch || echo "   elasticsearch hostname not resolvable"
          echo "   redis hostname:"
          nslookup redis || echo "   redis hostname not resolvable"
          echo ""
          echo "   Testing IP resolution:"
          echo "   elasticsearch IP:"
          getent hosts elasticsearch || echo "   elasticsearch IP not found"
          echo "   redis IP:"
          getent hosts redis || echo "   redis IP not found"
          echo ""
          echo "2. Direct container connectivity:"
          echo "   Testing elasticsearch:9200 directly:"
          curl -s --connect-timeout 5 http://elasticsearch:9200/_cluster/health || echo "   ❌ elasticsearch:9200 not reachable"
          echo "   Testing redis:6379 directly:"
          nc -z redis 6379 && echo "   ✅ redis:6379 reachable" || echo "   ❌ redis:6379 not reachable"
          echo ""
          echo "3. Port scanning localhost:"
          echo "   Scanning localhost ports 6379, 9200, 3000:"
          for port in 6379 9200 3000; do
            nc -z localhost $port && echo "   ✅ localhost:$port is open" || echo "   ❌ localhost:$port is closed"
          done
          echo ""
          echo "4. Container networking info:"
          echo "   /etc/hosts contents:"
          cat /etc/hosts
          echo ""
          echo "   Docker network info:"
          cat /proc/net/route || echo "   Route table not accessible"
          echo ""
          echo "5. Process network connections:"
          netstat -tulpn 2>/dev/null | grep -E "(6379|9200|3000)" || echo "   No processes listening on target ports"
          
      - name: Forward ports for container networking
        run: |
          echo "Setting up port forwarding for container networking..."
          # Forward localhost:6379 to redis:6379
          nohup socat TCP-LISTEN:6379,fork,reuseaddr TCP:redis:6379 > socat-redis.log 2>&1 &
          # Forward localhost:9200 to elasticsearch:9200  
          nohup socat TCP-LISTEN:9200,fork,reuseaddr TCP:elasticsearch:9200 > socat-elasticsearch.log 2>&1 &
          sleep 2
          echo "Port forwarding setup complete"
          echo ""
          echo "=== VERIFYING PORT FORWARDING ==="
          echo "Checking socat processes:"
          ps aux | grep socat | grep -v grep || echo "No socat processes found"
          echo ""
          echo "Testing forwarded ports:"
          echo "  localhost:6379 (should forward to redis:6379):"
          nc -z localhost 6379 && echo "  ✅ localhost:6379 is now open" || echo "  ❌ localhost:6379 still closed"
          echo "  localhost:9200 (should forward to elasticsearch:9200):"
          curl -s --connect-timeout 5 http://localhost:9200/_cluster/health && echo "  ✅ localhost:9200 is now accessible" || echo "  ❌ localhost:9200 still not accessible"
          echo ""
          echo "Testing socat connectivity:"
          echo "  Testing if socat can reach redis:6379:"
          nc -z redis 6379 && echo "  ✅ redis:6379 reachable from socat" || echo "  ❌ redis:6379 not reachable from socat"
          echo "  Testing if socat can reach elasticsearch:9200:"
          nc -z elasticsearch 9200 && echo "  ✅ elasticsearch:9200 reachable from socat" || echo "  ❌ elasticsearch:9200 not reachable from socat"
          echo ""
          echo "Checking socat logs for errors:"
          if [ -f socat-redis.log ]; then
            echo "Redis socat log:"
            cat socat-redis.log
          fi
          if [ -f socat-elasticsearch.log ]; then
            echo "Elasticsearch socat log:"
            cat socat-elasticsearch.log
          fi
          
      - name: Debug - Check services before Uwazi startup (after port forwarding)
        run: |
          echo "=== PRE-STARTUP SERVICE CHECK (AFTER PORT FORWARDING) ==="
          echo "Checking MongoDB connection..."
          mongosh --host localhost --port 27017 --quiet --eval 'db.runCommand({ ping: 1 })' || echo "MongoDB not responding"
          echo ""
          echo "Checking Redis connection (via localhost:6379 -> redis:6379):"
          if command -v redis-cli >/dev/null 2>&1; then
            redis-cli -h localhost -p 6379 ping || echo "Redis not responding via localhost"
          else
            echo "redis-cli not available, testing with nc:"
            nc -z localhost 6379 && echo "Redis:6379 reachable via localhost" || echo "Redis:6379 not reachable via localhost"
          fi
          echo ""
          echo "Checking Elasticsearch connection (via localhost:9200 -> elasticsearch:9200):"
          curl -s http://localhost:9200/_cluster/health || echo "Elasticsearch not responding via localhost"
          echo ""
          echo "All services should be running before starting Uwazi"
          
      - name: start Uwazi
        env:
          NOTIFICATION_DELAY: 50
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:9200
          DATABASE_NAME: uwazi_e2e
          INDEX_NAME: uwazi_e2e
          EXTERNAL_SERVICES: ${{ matrix.needs_external_services }}
          FEATURE_FLAG_PARAGRAPH_EXTRACTION: ${{ matrix.needs_external_services }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: .github/scripts/start-uwazi.sh
      
      - name: Debug - Check Uwazi startup and application state
        run: |
          echo "=== UWAZI STARTUP DEBUG ==="
          echo "Checking if Uwazi process is running:"
          ps aux | grep -E "(node|uwazi|server\.js)" | grep -v grep || echo "No Uwazi process found"
          echo ""
          echo "Checking Uwazi health endpoint:"
          for i in {1..10}; do
            echo "Attempt $i/10..."
            if curl -s http://localhost:3000/api/version; then
              echo "✅ Uwazi is responding"
              break
            else
              echo "❌ Uwazi not responding yet"
              sleep 3
            fi
          done
          echo ""
          echo "Checking application logs:"
          echo "Current directory: $(pwd)"
          echo "Looking for log files..."
          find . -name "*start-uwazi*" -o -name "*health-check*" 2>/dev/null || echo "No log files found"
          echo ""
          if [ -f .github/logs/start-uwazi-logs.txt ]; then
            echo "=== UWAZI STARTUP LOGS (last 50 lines) ==="
            tail -50 .github/logs/start-uwazi-logs.txt
          else
            echo "Startup log file not found at .github/logs/start-uwazi-logs.txt"
            echo "Checking if startup script has run yet..."
            ls -la .github/ 2>/dev/null || echo ".github directory not found"
            ls -la .github/logs/ 2>/dev/null || echo ".github/logs directory not found"
          fi
          echo ""
          echo "=== NETWORK CONNECTIVITY TEST ==="
          echo "Testing localhost connectivity:"
          curl -s http://localhost:3000/api/version | head -1 || echo "localhost:3000 not reachable"
          echo ""
          echo "Testing container networking:"
          echo "Testing localhost:9200 (elasticsearch)..."
          curl -s --connect-timeout 5 http://localhost:9200/_cluster/health && echo "✅ localhost:9200 reachable" || echo "❌ localhost:9200 not reachable"
          echo "Testing localhost:6379 (redis)..."
          nc -z localhost 6379 && echo "✅ localhost:6379 reachable" || echo "❌ localhost:6379 not reachable"
          echo ""
          echo "=== BROWSER ENVIRONMENT ==="
          echo "Chrome binary location:"
          which google-chrome
          echo ""
          echo "Chrome permissions:"
          ls -la /usr/bin/google-chrome
          echo ""
          echo "Display environment:"
          echo "DISPLAY=$DISPLAY"
          echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
          
      - name: Debug - Capture network and application state before tests
        run: |
          echo "=== PRE-TEST STATE CAPTURE ==="
          echo "Creating debug directory..."
          mkdir -p .github/debug
          
          echo "Capturing network connections..."
          if command -v netstat >/dev/null 2>&1; then
            netstat -tulpn > .github/debug/network-connections.txt
          else
            echo "netstat not available, using ss:" 
            ss -tulpn > .github/debug/network-connections.txt || echo "ss also not available" > .github/debug/network-connections.txt
          fi
          
          echo "Capturing process tree..."
          ps auxf > .github/debug/process-tree.txt
          
          echo "Capturing system load..."
          uptime > .github/debug/system-load.txt
          cat /proc/loadavg >> .github/debug/system-load.txt
          
          echo "Capturing memory usage..."
          free -h > .github/debug/memory-usage.txt
          
          echo "Testing application endpoints..."
          {
            echo "=== ENDPOINT TESTS ==="
            echo "API Version:"
            curl -s -w "HTTP %{http_code} - Time: %{time_total}s\n" http://localhost:3000/api/version
            echo ""
            echo "Health Check:"
            curl -s -w "HTTP %{http_code} - Time: %{time_total}s\n" http://localhost:3000/api/health || echo "Health endpoint not available"
            echo ""
            echo "Main App:"
            curl -s -w "HTTP %{http_code} - Time: %{time_total}s\n" -o /dev/null http://localhost:3000/
          } > .github/debug/endpoint-tests.txt
          
          echo "Capturing environment variables..."
          env | sort > .github/debug/environment-vars.txt
          
          echo "Debug files created in .github/debug/"
          ls -la .github/debug/
          
      - name: Debug - Test-specific environment checks
        run: |
          echo "=== TEST-SPECIFIC DEBUG ==="
          echo "Test matrix name: ${{ matrix.name }}"
          echo "Test spec: ${{ matrix.spec }}"
          echo ""
          
          # Check specific conditions for each test type
          if [ "${{ matrix.name }}" = "entities" ]; then
            echo "=== ENTITY TEST DEBUG ==="
            echo "Checking form state management..."
            echo "MongoDB collections in uwazi_e2e:"
            mongosh --host localhost --port 27017 --quiet --eval 'db.getCollectionNames()' uwazi_e2e
            echo ""
            echo "Elasticsearch templates:"
            curl -s http://elasticsearch:9200/_cat/templates?v || echo "Could not list templates"
          fi
          
          if [ "${{ matrix.name }}" = "base" ]; then
            echo "=== LOGIN TEST DEBUG ==="
            echo "Checking authentication system..."
            echo "MongoDB users collection:"
            mongosh --host localhost --port 27017 --quiet --eval 'db.users.find({}, {username: 1, email: 1}).limit(5)' uwazi_e2e
            echo ""
            echo "Redis authentication keys:"
            if command -v redis-cli >/dev/null 2>&1; then
              redis-cli -h redis -p 6379 keys "*session*" || echo "No session keys found"
              redis-cli -h redis -p 6379 keys "*auth*" || echo "No auth keys found"
            else
              echo "redis-cli not available, skipping Redis key inspection"
            fi
          fi
          
          if [ "${{ matrix.name }}" = "pages" ]; then
            echo "=== PUBLIC FORM TEST DEBUG ==="
            echo "Checking public form configuration..."
            echo "MongoDB settings:"
            mongosh --host localhost --port 27017 --quiet --eval 'db.settings.findOne({}, {allowedPublicTemplates: 1})' uwazi_e2e
            echo ""
            echo "Templates available:"
            mongosh --host localhost --port 27017 --quiet --eval 'db.templates.find({}, {name: 1, properties: 1}).limit(3)' uwazi_e2e
            echo ""
            echo "Redis notification keys:"
            if command -v redis-cli >/dev/null 2>&1; then
              redis-cli -h redis -p 6379 keys "*notification*" || echo "No notification keys found"
            else
              echo "redis-cli not available, skipping Redis key inspection"
            fi
          fi
          
      - name: Cypress run - ${{ matrix.name }}
        uses: cypress-io/github-action@v6
        with:
          browser: /usr/bin/google-chrome
          component: false
          config-file: cypress.config.ts
          spec: ${{ matrix.spec }}
          install: false
          # node_modules already installed, binary is cached
          record: false
          parallel: false
          config: |
            {
              "defaultCommandTimeout": 15000,
              "requestTimeout": 30000,
              "responseTimeout": 30000,
              "pageLoadTimeout": 30000,
              "video": true,
              "screenshotOnRunFailure": true,
              "trashAssetsBeforeRuns": false
            }
        timeout-minutes: 25
        env:
          DBHOST: localhost:27017
          ELASTICSEARCH_URL: http://localhost:9200
          TRANSPILED: true
          DEBUG: cypress:*
          CYPRESS_DEBUG: true
          
      - name: Debug - Post-test environment analysis
        if: always()
        run: |
          echo "=== POST-TEST DEBUG ==="
          echo "Test exit code: $?"
          echo ""
          echo "Uwazi process status:"
          ps aux | grep -E "(node|uwazi|server\.js)" | grep -v grep || echo "No Uwazi process found"
          echo ""
          echo "Database state:"
          mongosh --host localhost --port 27017 --quiet --eval 'db.adminCommand("listCollections")' uwazi_e2e || echo "Could not list collections"
          echo ""
          echo "Elasticsearch indices:"
          curl -s http://elasticsearch:9200/_cat/indices?v || echo "Could not list indices"
          echo ""
          echo "Redis keys:"
          redis-cli -h localhost -p 6379 keys "*" || echo "Could not list Redis keys"
          echo ""
          echo "System resources:"
          free -h
          df -h
          echo ""
          echo "Container memory usage:"
          cat /proc/meminfo | head -10
          echo ""
          echo "Container CPU info:"
          cat /proc/cpuinfo | grep -E "(processor|model name)" | head -5
          
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: snapshots-${{ matrix.name }}
          path: cypress/e2e/**/__image_snapshots__/
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: video-${{ matrix.name }}
          path: cypress/videos/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-info-${{ matrix.name }}
          path: .github/debug/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.name }}
          path: .github/logs/
      - name: Print server output
        run: |
          echo "📁 Startup logs:"
          if [ -f .github/logs/start-uwazi-logs.txt ]; then
            cat .github/logs/start-uwazi-logs.txt
          else
            echo "Startup log file not found"
            echo "Checking for log files in current directory:"
            find . -name "*log*" -type f 2>/dev/null | head -10 || echo "No log files found"
          fi
          echo
          echo "📁 Health-check logs:"
          if [ -f .github/logs/health-check-logs.txt ]; then
            cat .github/logs/health-check-logs.txt
          else
            echo "Health-check log file not found"
          fi
        if: failure()
