name: Auto version bump

# Keeps the version committed in the repo: when a PR targeting production still
# carries an already-released version, bump package.json to the next patch
# version and push that commit to the PR branch. The merged tree then already
# has a unique, unreleased version, so production is a pure retag and no build
# or manual bump is needed.
#
# "Released" is recorded in two places and the bump must honor both, because
# each has its own immutability guard:
#   - GHCR image tags (publish refuses to overwrite an existing `x.y.z` tag)
#   - GitHub releases (release.sh fails if `gh release create` sees a duplicate)
# So the version is bumped when it is not ahead of the max across both records.
#
# IMPORTANT: the bump is pushed with GH_TOKEN (a PAT), not GITHUB_TOKEN. Pushes
# made with GITHUB_TOKEN do not trigger new workflow runs, so CI would not
# rebuild the bumped tree. GH_TOKEN must have `contents: write` on the repo.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [production]

permissions:
  contents: write
  packages: read

concurrency:
  group: auto-version-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Bump version if already released
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          current="$(node -p "require('./package.json').version")"

          # Old flow's record: the latest GitHub release (written by release.sh).
          latest_release="$(gh release list --limit 100 --json tagName,isLatest --jq '[.[] | select(.isLatest == true)][0].tagName // empty')"

          # New flow's record: every tag published to the uwazi GHCR package
          # (written by the publish job). Read with the workflow token so this
          # needs only `packages: read`, not a `read:packages` scope on the PAT
          # used for the push below. The package does not exist until the first
          # publish, so a 404 is treated as "no image tags yet".
          image_tags="$(GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api --paginate \
            "/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions?per_page=100" 2>/dev/null \
            || echo '[]')"
          image_tags="$(jq -r '[.[] | .metadata.container.tags? // [] | .[]?] | unique | join(" ")' <<< "$image_tags")"

          echo "current=$current latest_release=${latest_release:-<none>} image_tags=${image_tags:-<none>}"

          # Decide whether to bump. The merged version must be fresh in BOTH
          # records (publish refuses an existing GHCR tag, release.sh refuses an
          # existing release), so bump unless `current` is ahead of the max
          # version across both. Pure Node, no dependencies needed.
          next="$(node - "$current" "${latest_release:-}" "${image_tags:-}" <<'EOF'
          const [current, release, imageTags] = process.argv.slice(2);
          const parts = v => v.split('.').slice(0, 3).map(n => parseInt(n, 10) || 0);
          const isSemver = v => /^\d+\.\d+\.\d+$/.test(v);
          const cmp = (x, y) => {
            const a = parts(x), b = parts(y);
            if (a[0] !== b[0]) return a[0] - b[0];
            if (a[1] !== b[1]) return a[1] - b[1];
            return a[2] - b[2];
          };
          const candidates = [release, ...(imageTags || '').split(/\s+/)].filter(isSemver);
          const latest = candidates.length ? candidates.sort(cmp).pop() : '';
          if (latest) {
            const a = parts(current), b = parts(latest);
            const ahead = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];
            if (ahead) process.exit(0);
            console.log(`${b[0]}.${b[1]}.${b[2] + 1}`);
          }
          EOF
          )"

          if [ -z "$next" ]; then
            echo "Version is ahead of the latest release and image tag; nothing to do."
            exit 0
          fi

          echo "Bumping $current -> $next"
          node - "$next" <<'EOF'
          const fs = require('fs');
          const next = process.argv[2];
          const p = fs.readFileSync('package.json', 'utf8');
          const out = p.replace(/"version"\s*:\s*"[^"]*"/, `"version": "${next}"`);
          if (out === p) {
            console.error('version field not found');
            process.exit(1);
          }
          fs.writeFileSync('package.json', out);
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          if git diff --cached --quiet; then
            echo 'No change to commit.'
            exit 0
          fi
          git commit -m "Bump version to $next"
          git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
