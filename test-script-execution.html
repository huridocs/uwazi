<!DOCTYPE html>
<html>
<head>
    <title>Test Script Execution</title>
</head>
<body>
    <h1>Testing Script Execution</h1>
    <div id="status">Loading...</div>
    <script>
        console.log('Inline script executed');
        window.__testInlineScript = true;
    </script>
    <script src="http://localhost:8080/main.js"></script>
    <script>
        setTimeout(() => {
            const status = document.getElementById('status');
            status.innerHTML = `
                <p>Inline script: ${window.__testInlineScript ? '✅' : '❌'}</p>
                <p>Entry client executing: ${window.__entryClientExecuting ? '✅' : '❌'}</p>
                <p>Router created: ${window.__entryClientRouterCreated ? '✅' : '❌'}</p>
                <p>About to hydrate: ${window.__entryClientAboutToHydrate ? '✅' : '❌'}</p>
                <p>Hydrated: ${window.__entryClientHydrated ? '✅' : '❌'}</p>
                <p>Login componentDidMount: ${window.__loginComponentDidMount ? '✅' : '❌'}</p>
            `;
        }, 2000);
    </script>
</body>
</html>
